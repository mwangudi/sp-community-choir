# St. Paul's Chapel Community Choir.
#
# Next.js renders every page on the server, so unlike the static SPAs on this
# droplet there is no `root`/`dist` to serve — nginx proxies everything to the
# Node process and only shortcuts the immutable build assets.
#
# Replace CHOIR_DOMAIN below before installing, then run certbot to add TLS.

upstream choir_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name CHOIR_DOMAIN;

    client_max_body_size 6M;   # uploads are capped at 5 MB in the app

    # Hashed build output — safe to cache hard.
    location /_next/static/ {
        proxy_pass http://choir_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Uploaded and pre-optimised photos, served straight off disk.
    location /uploads/ {
        alias /var/lib/choir-uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://choir_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
